<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title><link rel="stylesheet" href="style.css"></head>
<body><div class="auth-container"><div class="auth-card"><h1>Welcome Back</h1><p class="subtitle">Login to continue chatting</p><form id="loginForm"><input type="text" id="username" placeholder="Username" required><input type="password" id="password" placeholder="Password" required><button type="submit" class="btn primary">Login</button></form><p id="message"></p><p>Don't have an account? <a href="register.html">Register</a></p></div></div>
<script>
document.getElementById("loginForm").addEventListener("submit", async e => {
 e.preventDefault();
 const username=document.getElementById("username").value.trim();
 const password=document.getElementById("password").value;
 const message=document.getElementById("message");
 try {
  const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
  const data=await response.json();
  if(response.ok){localStorage.setItem("token",data.token);localStorage.setItem("username",data.username);location.href="chat.html";}
  else {message.innerText=data.message;message.className="error";}
 } catch(error){message.innerText="Unable to connect to server.";message.className="error";}
});
</script></body></html>
