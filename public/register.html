<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account</title><link rel="stylesheet" href="style.css"></head>
<body><div class="auth-container"><div class="auth-card"><h1>Create Account</h1><p class="subtitle">Join the real-time chat</p><form id="registerForm"><input type="text" id="username" placeholder="Username" required><input type="password" id="password" placeholder="Password" required minlength="6"><button type="submit" class="btn primary">Register</button></form><p id="message"></p><p>Already have an account? <a href="login.html">Login</a></p></div></div>
<script>
document.getElementById("registerForm").addEventListener("submit", async e => {
 e.preventDefault();
 const username=document.getElementById("username").value.trim();
 const password=document.getElementById("password").value;
 const message=document.getElementById("message");
 try {
  const response=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
  const data=await response.json(); message.innerText=data.message;
  if(response.ok){message.className="success";setTimeout(()=>location.href="login.html",1000)} else message.className="error";
 } catch(error){message.innerText="Unable to connect to server.";message.className="error";}
});
</script></body></html>
